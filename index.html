<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Star Natural</title>

  <!-- Vinculación del Manifest -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2e7d32">

  <style>
    /* Estilo para el banner de instalación */
    #banner-instalacion {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #2e7d32;
      color: white;
      padding: 15px 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 1000;
      text-align: center;
    }

    #btn-instalar {
      background-color: #ffffff;
      color: #2e7d32;
      border: none;
      padding: 8px 16px;
      margin-left: 10px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Banner de aviso -->
  <div id="banner-instalacion">
    <span>¿Quieres instalar esta App en tu móvil?</span>
    <button id="btn-instalar">Instalar</button>
  </div>

<script>
  // 1. Registrar el Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(() => console.log('Service Worker listo'))
      .catch(err => console.error('Error SW:', err));
  }

  let eventoInstalacion;
  const banner = document.getElementById('banner-instalacion');
  const btnInstalar = document.getElementById('btn-instalar');

  // 2. Capturar el evento de instalación
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    eventoInstalacion = e;

    // Lanza la ventana emergente automáticamente en cuanto el navegador lo permite
    // (Opcional) Puedes darle un pequeño retraso de 2 segundos para no saturar al cargar
    setTimeout(() => {
      lanzarInstalacionAutomatica();
    }, 2000);
  });

  async function lanzarInstalacionAutomatica() {
    if (eventoInstalacion) {
      // Dispara directamente el mensaje nativo del sistema operativo/navegador
      eventoInstalacion.prompt();
      const { outcome } = await eventoInstalacion.userChoice;
      console.log(`El usuario respondió: ${outcome}`);
      eventoInstalacion = null;
    }
  }

  // Mantenemos el botón manual por si el usuario cierra el prompt nativo y quiere volver a intentarlo
  if (btnInstalar) {
    btnInstalar.addEventListener('click', () => {
      lanzarInstalacionAutomatica();
    });
  }
</script>
</body>
</html>
